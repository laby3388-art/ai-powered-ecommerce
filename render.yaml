services:
  - type: web
    name: nook-ecommerce
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nook-ecommerce-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: nook-ecommerce-db
    plan: free
